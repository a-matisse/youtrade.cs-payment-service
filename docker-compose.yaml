version: '3.8'
services:

  youtrade-payment-service:
    image: youtrade-payment-service
    restart: on-failure
    network_mode: "host"
    env_file:
      - ./default.env
    command: >
      java
      --enable-preview
      -Xms64m -Xmx64m
      -XX:+UseZGC
      -XX:+AlwaysPreTouch
      -jar target/youtrade-payment-service-1.0.0.jar

volumes:
  postgres_data:
    external: true