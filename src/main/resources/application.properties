server.port=17555
spring.config.import=optional:file:.env[.properties]

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=25555
spring.data.redis.username=${DB_UNAME}
spring.data.redis.password=${DB_PASSWORD}

youtrade.payment.redis.stream.name=youtrade-payment
youtrade.payment.heleket.uuid=${HELEKET_UUID}
youtrade.payment.heleket.api=${HELEKET_API}

# TryBit API V2. Empty credentials leave Heleket available and disable TryBit requests.
youtrade.payment.trybit.api=${TRYBIT_API_KEY:}
youtrade.payment.trybit.shop-id=${TRYBIT_SHOP_ID:}
youtrade.payment.trybit.secret=${TRYBIT_SECRET_KEY:}
youtrade.payment.trybit.base-url=${TRYBIT_BASE_URL:https://api.trybit.com/v2}
youtrade.payment.trybit.poll-enabled=${TRYBIT_POLL_ENABLED:true}
youtrade.payment.trybit.poll-interval-ms=${TRYBIT_POLL_INTERVAL_MS:60000}
youtrade.payment.trybit.poll-lookback-days=${TRYBIT_POLL_LOOKBACK_DAYS:2}
